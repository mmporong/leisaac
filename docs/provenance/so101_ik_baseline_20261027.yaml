# Provenance for the black-box IK baseline: wrist-camera cube estimate + joint-space oracle (simulation only).
# Evidence paths under outputs/ and datasets/ are local and git-ignored.

wrist_cube_estimate:
  module: source/leisaac/leisaac/datagen/state_machine/wrist_cube_perception.py
  method: >-
    largest red blob (R > 90, R > 1.8 G, R > 1.8 B); camera pose = CPU forward kinematics of the measured
    joints + fitted wrist mount (docs/provenance/so101_finray_mount_20261026.yaml wrist_camera_fit);
    start = blob back-projected onto the cube-center plane (table + 20 mm); refine x, y, yaw so the
    projected cube silhouette maximizes intersection over union with the blob
  simulated_renders:
    measured_at: 2026-10-27
    frames: "obs/wrist[2] of 60 Mimic demos (10 seed42 + 50 seed43), cube truth = states cube pose[1]"
    sources:
      - datasets/pick_cube_into_black_box_mimic_generated_10_seed42_20261027.hdf5
      - datasets/pick_cube_into_black_box_mimic_generated_50_seed43_20261027.hdf5
    detected: 60/60
    position_error_mm: {mean: 0.34, p95: 0.59, max: 0.66}
    yaw_error_deg: {mean: 1.16, max: 3.31}
    runtime_ms_per_frame: 34
    centroid_only_position_error_mm: {mean: 1.6, max: 1.9, note: "start estimate alone; view-dependent, 10 mm in the synthetic oblique test"}
    limits: "the simulated camera matches the model exactly; a physical camera adds its fit error"
  stale_first_frames: >-
    obs/wrist[0] and [1] of every recorded demo (source oracle, annotated, Mimic) still show the previous
    episode's render; the scene appears from frame 2. Frames update every second control step.
  unit_tests: scripts/imitation_learning/test_wrist_cube_perception.py

ik_baseline_closed_loop_sim:
  script: scripts/evaluation/ik_baseline_pick_cube_into_black_box.py
  measured_at: 2026-10-27
  conditions: "LeIsaac-SO101-PickCubeIntoBlackBox-v0, seed 7000, robot gravity on, 4 render frames after reset, one wrist frame per episode"
  result: "10/10 cube released in the black box (stable_release_v2)"
  estimate_error_xy_mm: {mean: 0.39, max: 0.87}
  estimate_yaw_error_deg: {max: 3.48}
  fk_vs_isaac_gripper_error_m: "below 1e-6"
  source: outputs/pick_cube_into_black_box_ik_baseline_20261027/gravity_on/summary.json
  first_attempt: "stopped after episode 1 (success) because env.reset ran outside inference mode; kept in gravity_on_run1_stopped_after_1/"
privileged_oracle_regression_after_cube_pose_hook:
  command: "scripts/datagen/state_machine/generate.py --max_attempts 8 --seed 7100 (robot gravity off as in generate.py)"
  result: "8/8"
  source: outputs/pick_cube_into_black_box_ik_baseline_20261027/oracle_regression/summary.json
